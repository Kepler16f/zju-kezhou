# Linux 构建（单一平台文件，供 buildAll.yml 分发器按需调用）：
#   x64   —— ubuntu-latest，subosito/flutter-action，产 bundle 打 deb（amd64）
#   arm64 —— ubuntu-24.04-arm（GitHub 托管 ARM64 runner，公开仓库免费；reunion 项目同款）
#            手动装 Flutter：官方发布清单 releases_linux.json 里**没有任何 arm64 SDK 归档**
#            （744 条记录全 x64），subosito/flutter-action 在 arm64 上装不上；改为 clone
#            官方仓库，Flutter 会按 uname -m=aarch64 自举 dart-sdk-linux-arm64 与
#            linux-arm64 引擎产物（两者在发布存储桶里都存在）。
# 交付形态：deb 直装包（用户 2026-10-18 要求 linux 出 deb）；bundle 装 /opt/kezhou，
#   /usr/bin/kezhou 软链入口 + 桌面项 + hicolor 图标；版本取自 pubspec 防漂移。
name: Build Linux

on:
  workflow_call:
    inputs:
      x64: {type: boolean, default: true}
      arm64: {type: boolean, default: false}
  workflow_dispatch:
    inputs:
      x64: {description: 'Linux x64', type: boolean, default: true}
      arm64: {description: 'Linux arm64', type: boolean, default: false}

jobs:
  linux-x64:
    name: Linux x64
    if: ${{ inputs.x64 }}
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: compass_app}}
    steps:
      - uses: actions/checkout@v4
      - name: 依赖
        run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config libgtk-3-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with: {channel: stable, flutter-version: 3.47.7}
      - run: flutter build linux --release
      # bundle 是目录——打 deb 直装包（用户 2026-10-18 要求 linux 出 deb）：
      # bundle 装 /opt/kezhou，/usr/bin/kezhou 软链 + .desktop + 图标；版本取自 pubspec。
      - name: 打包 bundle 为 deb（amd64）
        run: |
          VER=$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//')
          bash "${{ github.workspace }}/packaging/build_linux_deb.sh" \
            build/linux/x64/release/bundle amd64 "$VER" \
            "${{ github.workspace }}/compass_app/build/KeZhou-linux-amd64.deb" \
            android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
      - uses: actions/upload-artifact@v7
        with:
          name: kezhou-linux-x64
          archive: false
          if-no-files-found: error
          path: compass_app/build/KeZhou-linux-amd64.deb

  linux-arm64:
    name: Linux arm64
    if: ${{ inputs.arm64 }}
    runs-on: ubuntu-24.04-arm
    defaults: {run: {working-directory: compass_app}}
    steps:
      - uses: actions/checkout@v4

      - name: 依赖
        run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config libgtk-3-dev libsecret-1-dev

      - name: 安装 Flutter（ARM64 原生，手动装）
        shell: bash
        run: |
          # subosito/flutter-action 依赖官方 SDK 归档，而 releases_linux.json 无 arm64 包；
          # clone 官方仓库后，bin/internal/update_dart_sdk.sh 会按 uname -m 取
          # dart-sdk-linux-arm64.zip，flutter precache 取 linux-arm64 引擎产物。
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          echo "FLUTTER_ROOT=$RUNNER_TEMP/flutter" >> "$GITHUB_ENV"

      - name: 自举 Dart SDK（首次运行会下载 arm64 SDK）
        run: flutter --version

      - run: flutter build linux --release

      - name: 校验产物架构（必须是 aarch64，防 x64 冒充）
        run: |
          BIN=build/linux/arm64/release/bundle/compass_app
          if [ ! -x "$BIN" ]; then echo "产物缺失：$BIN"; ls -R build/linux | head -30; exit 1; fi
          file "$BIN"
          file "$BIN" | grep -q aarch64 || { echo "架构不是 aarch64"; exit 1; }

      - name: 打包 bundle 为 deb（arm64）
        run: |
          VER=$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//')
          bash "${{ github.workspace }}/packaging/build_linux_deb.sh" \
            build/linux/arm64/release/bundle arm64 "$VER" \
            "${{ github.workspace }}/compass_app/build/KeZhou-linux-arm64.deb" \
            android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
      - uses: actions/upload-artifact@v7
        with:
          name: kezhou-linux-arm64
          archive: false
          if-no-files-found: error
          path: compass_app/build/KeZhou-linux-arm64.deb
