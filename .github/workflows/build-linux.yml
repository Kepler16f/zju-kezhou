# Linux 构建（单一平台文件，供 build.yml 分发器按需调用）：
# x64 bundle（打 tar.gz）。arm64 暂缺——Flutter stable 无 linux-arm64 发布档，
# 待官方发布后加 job（runs-on: ubuntu-24.04-arm）。
name: Build Linux

on:
  workflow_call: {}
  workflow_dispatch: {}   # 单独跑本平台（不经过分发器的金标门）

jobs:
  linux-x64:
    name: Linux x64
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: compass_app}}
    steps:
      - uses: actions/checkout@v4
      - name: 依赖
        run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config libgtk-3-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with: {channel: stable, flutter-version: 3.47.7}
      - run: flutter build linux --release
      # bundle 是目录——打 tar.gz 后上传单文件
      - name: 打包 bundle 为 tar.gz
        run: |
          cd build/linux/x64/release
          tar czf ../../../KeZhou-linux-x64.tar.gz bundle
      - uses: actions/upload-artifact@v7
        with:
          name: kezhou-linux-x64
          archive: false
          path: compass_app/build/linux/KeZhou-linux-x64.tar.gz
