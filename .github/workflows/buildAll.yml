# 构建分发器：勾选平台 + 各平台内部勾选架构，一次触发。
#  - engine-check（双引擎金标一致性）总是先跑，作为所有平台构建的门
#  - push main/master：只跑质量门（快速反馈，不自动出包）
#  - push tag v*：全平台按"默认架构"自动出包（发布，含三个 arm64）
#  - 手动（Actions 页 Run workflow）：按勾选构建；不勾任何平台则只跑质量门
# 约定：默认勾"常用架构"（Android arm64 / Windows x64+arm64 / macOS arm64 / Linux x64），
#       其余架构按需勾选。Windows arm64 走托管 windows-11-arm，Linux arm64 走托管
#       ubuntu-24.04-arm，两者都免费、无需自托管。
#       版本号取自 compass_app/pubspec.yaml，构建前先确认版本。
name: Build all platforms

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      android:
        description: 'Android'
        type: boolean
        default: true
      android_arm64:
        description: 'Android arm64'
        type: boolean
        default: true
      android_armv7:
        description: 'Android armv7'
        type: boolean
        default: false
      android_x64:
        description: 'Android x64'
        type: boolean
        default: false
      windows:
        description: 'Windows'
        type: boolean
        default: true
      windows_x64:
        description: 'Windows x64'
        type: boolean
        default: true
      windows_arm64:
        description: 'Windows arm64'
        type: boolean
        default: true
      macos:
        description: 'macOS'
        type: boolean
        default: false
      macos_arm64:
        description: 'macOS arm64'
        type: boolean
        default: true
      macos_x64:
        description: 'macOS x64'
        type: boolean
        default: false
      ios:
        description: 'iOS'
        type: boolean
        default: false
      linux:
        description: 'Linux'
        type: boolean
        default: false
      linux_x64:
        description: 'Linux x64'
        type: boolean
        default: true
      linux_arm64:
        description: 'Linux arm64'
        type: boolean
        default: false
      hap:
        description: 'HarmonyOS'
        type: boolean
        default: false

jobs:
  engine-check:
    name: 双引擎金标一致性（Python↔Dart）
    uses: ./.github/workflows/_engine-check.yml

  android:
    name: Android
    needs: engine-check
    if: ${{ inputs.android == true || startsWith(github.ref, 'refs/tags/v') }}
    uses: ./.github/workflows/build-android.yml
    with:
      arm64: ${{ github.event_name != 'workflow_dispatch' || inputs.android_arm64 }}
      armv7: ${{ github.event_name != 'workflow_dispatch' || inputs.android_armv7 }}
      x64: ${{ github.event_name != 'workflow_dispatch' || inputs.android_x64 }}

  windows:
    name: Windows
    needs: engine-check
    if: ${{ inputs.windows == true || startsWith(github.ref, 'refs/tags/v') }}
    uses: ./.github/workflows/build-windows.yml
    with:
      x64: ${{ github.event_name != 'workflow_dispatch' || inputs.windows_x64 }}
      arm64: ${{ github.event_name != 'workflow_dispatch' || inputs.windows_arm64 }}

  macos:
    name: macOS
    needs: engine-check
    if: ${{ inputs.macos == true || startsWith(github.ref, 'refs/tags/v') }}
    uses: ./.github/workflows/build-macos.yml
    with:
      arm64: ${{ github.event_name != 'workflow_dispatch' || inputs.macos_arm64 }}
      x64: ${{ github.event_name != 'workflow_dispatch' || inputs.macos_x64 }}

  ios:
    name: iOS
    needs: engine-check
    if: ${{ inputs.ios == true || startsWith(github.ref, 'refs/tags/v') }}
    uses: ./.github/workflows/build-ios.yml

  linux:
    name: Linux
    needs: engine-check
    if: ${{ inputs.linux == true || startsWith(github.ref, 'refs/tags/v') }}
    uses: ./.github/workflows/build-linux.yml
    with:
      x64: ${{ github.event_name != 'workflow_dispatch' || inputs.linux_x64 }}
      arm64: ${{ github.event_name != 'workflow_dispatch' || inputs.linux_arm64 }}

  hap:
    name: HarmonyOS
    needs: engine-check
    if: ${{ inputs.hap == true || startsWith(github.ref, 'refs/tags/v') }}
    uses: ./.github/workflows/build-hap.yml
