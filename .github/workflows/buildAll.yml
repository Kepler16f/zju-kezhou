# 手动构建分发器：勾选需要的平台，一次触发。
#  - engine-check（双引擎金标一致性）总是先跑，作为所有平台构建的门
#  - push main/master：只跑质量门（快速反馈，不自动出包）
#  - push tag v*：全平台自动构建（发布）
#  - 手动（Actions 页 Run workflow）：按勾选构建
# Windows arm64 需要 Windows-on-ARM 自托管 runner（仓库未配置时该 job 会排队挂起，
# 默认不勾选）；本机 arm64 出包走 packaging/build_windows_installer.sh。
name: 构建分发（勾选平台）

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      android:
        description: 'Android APK（arm64-v8a / armeabi-v7a / x86_64）'
        type: boolean
        default: true
      windows:
        description: 'Windows x64 Setup.exe'
        type: boolean
        default: true
      macos:
        description: 'macOS（arm64 + x86_64 zip）'
        type: boolean
        default: false
      ios:
        description: 'iOS 无签名 IPA'
        type: boolean
        default: false
      linux:
        description: 'Linux x64 tar.gz'
        type: boolean
        default: false
      hap:
        description: '鸿蒙 HarmonyOS NEXT HAP'
        type: boolean
        default: false
      windows_arm64:
        description: 'Windows arm64（需自托管 ARM runner，未配置会挂起）'
        type: boolean
        default: false

jobs:
  engine-check:
    name: 双引擎金标一致性（Python↔Dart）
    uses: ./.github/workflows/_engine-check.yml

  android:
    name: Android
    needs: engine-check
    if: ${{ inputs.android == true || startsWith(github.ref, 'refs/tags/v') }}
    uses: ./.github/workflows/build-android.yml

  windows:
    name: Windows x64
    needs: engine-check
    if: ${{ inputs.windows == true || startsWith(github.ref, 'refs/tags/v') }}
    uses: ./.github/workflows/build-windows.yml

  macos:
    name: macOS
    needs: engine-check
    if: ${{ inputs.macos == true || startsWith(github.ref, 'refs/tags/v') }}
    uses: ./.github/workflows/build-macos.yml

  ios:
    name: iOS
    needs: engine-check
    if: ${{ inputs.ios == true || startsWith(github.ref, 'refs/tags/v') }}
    uses: ./.github/workflows/build-ios.yml

  linux:
    name: Linux
    needs: engine-check
    if: ${{ inputs.linux == true || startsWith(github.ref, 'refs/tags/v') }}
    uses: ./.github/workflows/build-linux.yml

  hap:
    name: HarmonyOS HAP
    needs: engine-check
    if: ${{ inputs.hap == true || startsWith(github.ref, 'refs/tags/v') }}
    uses: ./.github/workflows/build-hap.yml

  # Windows arm64（需自托管 ARM runner）：不做成可复用平台文件，直接挂在这里。
  windows-arm64:
    name: Windows arm64（自托管 runner）
    runs-on: [self-hosted, Windows, ARM64]
    needs: engine-check
    if: ${{ inputs.windows_arm64 == true }}
    defaults: {run: {working-directory: compass_app}}
    steps:
      - uses: actions/checkout@v4
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v7
        with:
          name: compass-windows-arm64
          archive: false
          path: compass_app/build/windows/arm64/runner/Release/kezhou.exe
