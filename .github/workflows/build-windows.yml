# Windows 构建（单一平台文件，供 buildAll.yml 分发器按需调用）：
#   x64   —— windows-latest，Setup.exe（Inno Setup，内置 VC 运行库）
#   arm64 —— windows-11-arm（GitHub 托管 ARM64 runner，公开仓库免费，无需自托管）
#            注意：subosito/flutter-action 不发布 Windows ARM64 归档（releases_windows.json
#            只有 x64），故本 job 直接 clone flutter 仓库，由 Flutter 按
#            PROCESSOR_ARCHITECTURE=ARM64 自举 arm64 Dart SDK。
name: Build Windows

on:
  workflow_call:
    inputs:
      x64: {type: boolean, default: true}
      arm64: {type: boolean, default: false}
  workflow_dispatch:
    inputs:
      x64: {description: 'Windows x64', type: boolean, default: true}
      arm64: {description: 'Windows arm64', type: boolean, default: false}

jobs:
  windows-x64:
    name: Windows x64
    if: ${{ inputs.x64 }}
    runs-on: windows-latest
    defaults: {run: {working-directory: compass_app}}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable, flutter-version: 3.47.7}
      - uses: microsoft/setup-msbuild@v2
      - name: Inno Setup
        run: choco install innosetup -y
      - run: flutter build windows --release --no-tree-shake-icons
      - name: 打包 Setup.exe
        shell: pwsh
        run: |
          $ver = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          "AppVersion = $ver"
          # VC 运行库：用 vswhere 定位 VS 安装根（runner 是 Enterprise，本机是 BuildTools）
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -property installationPath
          "VS Path: $vsPath"
          $crt = Get-ChildItem "$vsPath\VC\Redist\MSVC" -Recurse -Filter vcruntime140.dll -ErrorAction SilentlyContinue |
            Where-Object FullName -match "x64\\Microsoft\.VC\d+\.CRT" |
            Sort-Object FullName -Desc | Select-Object -First 1
          if (-not $crt) {
            # 兜底：从系统 System32 拷（runner 已装 VC Runtime）
            $crt = Get-Item "C:\Windows\System32\vcruntime140.dll"
            "Fallback: System32 $($crt.FullName)"
          }
          $rel = "build\windows\x64\runner\Release"
          Copy-Item $crt.FullName $rel -Force
          $msvc = Join-Path $crt.DirectoryName "msvcp140.dll"
          if (Test-Path $msvc) { Copy-Item $msvc $rel -Force }
          $iss = "kezhou_setup.iss"
          $relFull = (Resolve-Path $rel).Path
          $icon  = (Resolve-Path "windows\runner\resources\app_icon.ico").Path
          @"
          [Setup]
          AppId={{8F4B1D5E-92A6-4C7B-B3E0-KEZHOU00002}
          AppName=课舟
          AppVersion=$ver
          AppPublisher=KeZhou Team
          DefaultDirName={autopf}\KeZhou
          DefaultGroupName=课舟
          UninstallDisplayIcon={app}\kezhou.exe
          OutputDir=..\dist
          OutputBaseFilename=KeZhouSetup-$ver-win-x64
          ArchitecturesAllowed=x64
          ArchitecturesInstallIn64BitMode=x64
          Compression=lzma2/max
          SolidCompression=yes
          SetupIconFile=$icon
          DisableProgramGroupPage=yes
          PrivilegesRequired=lowest
          PrivilegesRequiredOverridesAllowed=dialog
          [Files]
          Source: "$relFull\\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          [Icons]
          Name: "{group}\\课舟"; Filename: "{app}\\kezhou.exe"
          Name: "{autodesktop}\\课舟"; Filename: "{app}\\kezhou.exe"
          [Run]
          Filename: "{app}\\kezhou.exe"; Description: "立即运行课舟"; Flags: nowait postinstall skipifsilent
          "@ | Set-Content $iss -Encoding UTF8
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-ChildItem "${env:ProgramFiles(x86)}\Inno*","${env:ProgramFiles}\Inno*" -Recurse -Filter ISCC.exe -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc $iss
      - uses: actions/upload-artifact@v7
        with:
          name: kezhou-windows-x64-setup
          archive: false
          path: dist/KeZhouSetup-*-win-x64.exe

  windows-arm64:
    name: Windows arm64
    if: ${{ inputs.arm64 }}
    runs-on: windows-11-arm
    defaults: {run: {working-directory: compass_app}}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter（ARM64 原生，手动装）
        shell: pwsh
        run: |
          # subosito/flutter-action 未发布 Windows ARM64 归档（releases_windows.json 只有 x64），
          # 直接 clone 官方仓库：Flutter 会按 PROCESSOR_ARCHITECTURE（本 runner 为 ARM64）
          # 自举 arm64 Dart SDK。版本与其它平台 job 保持一致（3.47.7）。
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git C:\flutter
          & C:\flutter\bin\flutter --version
          Add-Content -Path $env:GITHUB_ENV -Value "FLUTTER_ROOT=C:\flutter" -Encoding utf8
          Add-Content -Path $env:GITHUB_PATH -Value "C:\flutter\bin" -Encoding utf8

      - name: Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --limit-output

      - run: flutter pub get
      - run: flutter build windows --release --no-tree-shake-icons

      - name: 校验产物架构（必须是 ARM64，防 x64 冒充）
        shell: pwsh
        run: |
          $exe = "build\windows\arm64\runner\Release\kezhou.exe"
          if (-not (Test-Path $exe)) { throw "产物缺失：$exe" }
          $fs = [IO.File]::OpenRead($exe)
          $br = New-Object IO.BinaryReader($fs)
          $fs.Position = 0x3C; $pe = $br.ReadInt32()
          $fs.Position = $pe + 4; $machine = $br.ReadUInt16()
          $fs.Close()
          if ($machine -ne 0xAA64) { throw ("架构不是 ARM64：0x{0:X}" -f $machine) }
          "kezhou.exe machine = ARM64"

      - name: 打包 Setup.exe（arm64，含 arm64 VC 运行库）
        shell: pwsh
        run: |
          $ver = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          "AppVersion = $ver"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -property installationPath
          "VS Path: $vsPath"
          $crt = Get-ChildItem "$vsPath\VC\Redist\MSVC" -Recurse -Filter vcruntime140.dll -ErrorAction SilentlyContinue |
            Where-Object FullName -match "arm64\\Microsoft\.VC\d+\.CRT" |
            Sort-Object FullName -Desc | Select-Object -First 1
          if (-not $crt) { throw "未找到 arm64 VC 运行库（$vsPath\VC\Redist\MSVC 下无 arm64\Microsoft.VC*.CRT）" }
          $rel = "build\windows\arm64\runner\Release"
          foreach ($pat in @("vcruntime140*.dll", "msvcp140*.dll")) {
            Get-ChildItem $crt.DirectoryName -Filter $pat | ForEach-Object {
              Copy-Item $_.FullName $rel -Force
              "copied $($_.Name)"
            }
          }
          $iss = "kezhou_setup_arm64.iss"
          $relFull = (Resolve-Path $rel).Path
          $icon  = (Resolve-Path "windows\runner\resources\app_icon.ico").Path
          @"
          [Setup]
          AppId={{8F4B1D5E-92A6-4C7B-B3E0-KEZHOU00002}
          AppName=课舟
          AppVersion=$ver
          AppPublisher=KeZhou Team
          DefaultDirName={autopf}\KeZhou
          DefaultGroupName=课舟
          UninstallDisplayIcon={app}\kezhou.exe
          OutputDir=..\dist
          OutputBaseFilename=KeZhouSetup-$ver-win-arm64
          ArchitecturesAllowed=arm64
          ArchitecturesInstallIn64BitMode=arm64
          Compression=lzma2/max
          SolidCompression=yes
          SetupIconFile=$icon
          DisableProgramGroupPage=yes
          PrivilegesRequired=lowest
          PrivilegesRequiredOverridesAllowed=dialog
          [Files]
          Source: "$relFull\\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          [Icons]
          Name: "{group}\\课舟"; Filename: "{app}\\kezhou.exe"
          Name: "{autodesktop}\\课舟"; Filename: "{app}\\kezhou.exe"
          [Run]
          Filename: "{app}\\kezhou.exe"; Description: "立即运行课舟"; Flags: nowait postinstall skipifsilent
          "@ | Set-Content $iss -Encoding UTF8
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          & $iscc $iss
      - uses: actions/upload-artifact@v7
        with:
          name: kezhou-windows-arm64-setup
          archive: false
          path: dist/KeZhouSetup-*-win-arm64.exe
