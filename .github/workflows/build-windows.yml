# Windows 构建（单一平台文件，供 build.yml 分发器按需调用）：
#  - windows-x64：Setup.exe（Inno Setup，内置 VC 运行库）
#  - windows-arm64：Flutter 官方不支持 x64 交叉编译桌面，需 Windows-on-ARM 自托管 runner
#    （默认不勾选）；本机（arm64）出包走 packaging/build_windows_installer.sh。
name: Build Windows

on:
  workflow_call: {}
  workflow_dispatch: {}   # 单独跑本平台（不经过分发器的金标门）

jobs:
  windows-x64:
    name: Windows x64（Setup.exe 安装包）
    runs-on: windows-latest
    defaults: {run: {working-directory: compass_app}}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable, flutter-version: 3.47.7}
      - uses: microsoft/setup-msbuild@v2
      - name: Inno Setup
        run: choco install innosetup -y
      - run: flutter build windows --release --no-tree-shake-icons
      - name: 打包 Setup.exe
        shell: pwsh
        run: |
          $ver = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          "AppVersion = $ver"
          # VC 运行库：用 vswhere 定位 VS 安装根（runner 是 Enterprise，本机是 BuildTools）
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -property installationPath
          "VS Path: $vsPath"
          $crt = Get-ChildItem "$vsPath\VC\Redist\MSVC" -Recurse -Filter vcruntime140.dll -ErrorAction SilentlyContinue |
            Where-Object FullName -match "x64\\Microsoft\.VC\d+\.CRT" |
            Sort-Object FullName -Desc | Select-Object -First 1
          if (-not $crt) {
            # 兜底：从系统 System32 拷（runner 已装 VC Runtime）
            $crt = Get-Item "C:\Windows\System32\vcruntime140.dll"
            "Fallback: System32 $($crt.FullName)"
          }
          $rel = "build\windows\x64\runner\Release"
          Copy-Item $crt.FullName $rel -Force
          $msvc = Join-Path $crt.DirectoryName "msvcp140.dll"
          if (Test-Path $msvc) { Copy-Item $msvc $rel -Force }
          $iss = "kezhou_setup.iss"
          $relFull = (Resolve-Path $rel).Path
          $icon  = (Resolve-Path "windows\runner\resources\app_icon.ico").Path
          @"
          [Setup]
          AppId={{8F4B1D5E-92A6-4C7B-B3E0-KEZHOU00002}
          AppName=课舟
          AppVersion=$ver
          AppPublisher=KeZhou Team
          DefaultDirName={autopf}\KeZhou
          DefaultGroupName=课舟
          UninstallDisplayIcon={app}\kezhou.exe
          OutputDir=..\dist
          OutputBaseFilename=KeZhouSetup-$ver-win-x64
          ArchitecturesAllowed=x64
          ArchitecturesInstallIn64BitMode=x64
          Compression=lzma2/max
          SolidCompression=yes
          SetupIconFile=$icon
          DisableProgramGroupPage=yes
          PrivilegesRequired=lowest
          PrivilegesRequiredOverridesAllowed=dialog
          [Files]
          Source: "$relFull\\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          [Icons]
          Name: "{group}\\课舟"; Filename: "{app}\\kezhou.exe"
          Name: "{autodesktop}\\课舟"; Filename: "{app}\\kezhou.exe"
          [Run]
          Filename: "{app}\\kezhou.exe"; Description: "立即运行课舟"; Flags: nowait postinstall skipifsilent
          "@ | Set-Content $iss -Encoding UTF8
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-ChildItem "${env:ProgramFiles(x86)}\Inno*","${env:ProgramFiles}\Inno*" -Recurse -Filter ISCC.exe -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc $iss
      - uses: actions/upload-artifact@v7
        with:
          name: kezhou-windows-x64-installer
          archive: false
          path: dist/KeZhouSetup-*-win-x64.exe

  # Windows arm64 已移出本文件：Flutter 官方不支持从 x64 交叉编译桌面，需
  # Windows-on-ARM 自托管 runner。手动勾选入口在 build.yml 分发器（默认不勾）；
  # 本机出包走 packaging/build_windows_installer.sh arm64。
