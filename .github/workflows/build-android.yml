# Android 构建（单一平台文件，供 buildAll.yml 分发器按需调用）：
# 按勾选架构构建——arm64-v8a / armeabi-v7a / x86_64（x86 32 位引擎已停止支持）。
# 勾选多个架构时一次 make 完成（--target-platform 逗号列表 + --split-per-abi 分包）。
name: Build Android

on:
  workflow_call:
    inputs:
      arm64: {type: boolean, default: true}
      armv7: {type: boolean, default: false}
      x64: {type: boolean, default: false}
  workflow_dispatch:
    inputs:
      arm64: {description: 'Android arm64', type: boolean, default: true}
      armv7: {description: 'Android armv7', type: boolean, default: false}
      x64: {description: 'Android x64', type: boolean, default: false}

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: compass_app}}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable, flutter-version: 3.47.7}
      - name: 构建 APK（按勾选架构）
        shell: bash
        run: |
          TARGETS=()
          if [ "${{ inputs.arm64 }}" = "true" ]; then TARGETS+=("android-arm64"); fi
          if [ "${{ inputs.armv7 }}" = "true" ]; then TARGETS+=("android-arm"); fi
          if [ "${{ inputs.x64 }}" = "true" ]; then TARGETS+=("android-x64"); fi
          if [ ${#TARGETS[@]} -eq 0 ]; then
            echo "::error::未勾选任何架构（arm64 / armv7 / x64）"
            exit 1
          fi
          IFS=,; LIST="${TARGETS[*]}"; unset IFS
          echo "target-platform=$LIST"
          flutter build apk --release --split-per-abi --target-platform "$LIST"
          ls -la build/app/outputs/flutter-apk/
      # archive:false 只支持单文件——每个 APK 单独上传
      - uses: actions/upload-artifact@v7
        if: ${{ inputs.arm64 }}
        with:
          name: kezhou-android-arm64
          archive: false
          path: compass_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
      - uses: actions/upload-artifact@v7
        if: ${{ inputs.armv7 }}
        with:
          name: kezhou-android-armv7
          archive: false
          path: compass_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
      - uses: actions/upload-artifact@v7
        if: ${{ inputs.x64 }}
        with:
          name: kezhou-android-x64
          archive: false
          path: compass_app/build/app/outputs/flutter-apk/app-x86_64-release.apk
