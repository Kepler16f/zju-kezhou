# 鸿蒙 HarmonyOS NEXT HAP 构建（流程参考开源项目 Helechron 验证过的 GitHub Actions 配置）
# 说明：本仓库不提交 ohos/ 脚手架，CI 用 flutter-ohos 的 `flutter create --platforms ohos` 现场生成，
#       并注入 openharmony-sig 的 path_provider 依赖覆盖（仅本 job 生效，不影响其他平台构建）。
name: Build HarmonyOS HAP

on:
  push:
    branches: [main, master]
  workflow_call: {}   # 供 build.yml 分发器按需调用
  workflow_dispatch:

jobs:
  build-hap:
    runs-on: ubuntu-latest
    env:
      FLUTTER_OHOS_REPO: https://gitcode.com/openharmony-tpc/flutter_flutter.git
      FLUTTER_OHOS_REF: 3.27.5-ohos-1.0.8
      PUB_HOSTED_URL: https://pub.flutter-io.cn
      FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
    defaults: {run: {working-directory: compass_app}}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev

      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}

      - name: Setup HarmonyOS SDK
        uses: ErBWs/setup-ohos@v2
        with: {version: 26.0.0.821, cache: true}

      - name: Clone Flutter-ohos SDK
        run: |
          FLUTTER_OHOS_DIR="$RUNNER_TEMP/flutter_ohos"
          git clone --branch "$FLUTTER_OHOS_REF" --depth 1 "$FLUTTER_OHOS_REPO" "$FLUTTER_OHOS_DIR"
          git config --global --add safe.directory "$FLUTTER_OHOS_DIR"
          echo "$FLUTTER_OHOS_DIR/bin" >> "$GITHUB_PATH"
          echo "FLUTTER_ROOT=$FLUTTER_OHOS_DIR" >> "$GITHUB_ENV"
        timeout-minutes: 20

      - name: Configure npm registry (hvigor 依赖)
        run: |
          echo "registry=https://repo.huaweicloud.com/repository/npm/" > ~/.npmrc
          echo "@ohos:registry=https://repo.harmonyos.com/npm/" >> ~/.npmrc

      - name: 注入 ohos 依赖覆盖（path_provider openharmony-sig fork）
        working-directory: compass_app
        run: |
          # pubspec 已有 dependency_overrides 段（path_provider_android 锁版本），
          # 用 sed 插入而非追加，避免重复键。幂等：已注入则跳过。
          if ! grep -q "openharmony-sig/flutter_packages" pubspec.yaml; then
            sed -i '/^dependency_overrides:/a\  path_provider:\n    git:\n      url: https://gitee.com/openharmony-sig/flutter_packages.git\n      path: packages/path_provider/path_provider' pubspec.yaml
            echo "injected path_provider override"
          else
            echo "already injected, skip"
          fi
          grep -A5 "dependency_overrides" pubspec.yaml | head -8

      - name: 生成 ohos 平台脚手架（已存在则跳过）
        run: |
          [ -d ohos ] || flutter create --platforms ohos .
          sed -i 's/bundleName": ".*"/bundleName": "edu.zju.compass"/' ohos/AppScope/app.json5 || true

      - name: 应用名改「课舟」（AppScope + entry 全部语言目录，en_US 用 KeZhou）
        run: |
          python3 ../packaging/set_ohos_app_name.py ohos
          # 防回归：桌面标签（module.json5 → $string:EntryAbility_label）按设备语言
          # 从 base/zh_CN/en_US 覆盖目录取词；任何一处漏改都会让装上仍显示 compass_app。
          if grep -rl '"compass_app"' ohos/AppScope/resources ohos/entry/src/main/resources 2>/dev/null; then
            echo "::error::仍有 string.json 携带 compass_app 显示名（见上列表）"
            exit 1
          fi
          echo "桌面显示名已确认无 compass_app 残留"

      - name: 注入应用图标（分层：圆角矩形 + 圆形裁切安全区）
        run: |
          # 图标由 packaging/make_icons.py 生成并入库；脚手架里是模板默认图标，逐处覆盖。
          # 分层图标 = 鸿蒙版"自适应图标"：背景铺满，前景（字标）在安全区内，
          # 桌面按圆形/圆角矩形裁切都不会切到主体。
          APP_MEDIA="ohos/AppScope/resources/base/media"
          ENTRY_MEDIA="ohos/entry/src/main/resources/base/media"
          mkdir -p "$APP_MEDIA" "$ENTRY_MEDIA"
          cp -v assets/brand/ohos/foreground.png     "$APP_MEDIA/foreground.png"
          cp -v assets/brand/ohos/background.png     "$APP_MEDIA/background.png"
          cp -v assets/brand/ohos/layered_image.json "$APP_MEDIA/layered_image.json"
          cp -v assets/brand/ohos/app_icon.png       "$APP_MEDIA/app_icon.png"
          cp -v assets/brand/ohos/icon.png           "$ENTRY_MEDIA/icon.png"
          cp -v assets/brand/ohos/startIcon.png      "$ENTRY_MEDIA/startIcon.png"
          # AppScope(app.json5) 指向分层图标；无匹配则保持模板引用（不致失败）
          APP_JSON="ohos/AppScope/app.json5"
          if [ -f "$APP_JSON" ] && ! grep -q 'layered_image' "$APP_JSON"; then
            sed -i -E 's|("icon"\s*:\s*)"\$media:[A-Za-z_]+"|\1"$media:layered_image"|' "$APP_JSON" || true
          fi
          grep -n '"icon"' "$APP_JSON" || true

      - name: Get dependencies
        run: |
          for i in 1 2 3 4 5; do
            flutter pub get && exit 0
            echo "::warning::pub get failed (gitee 限流可能)，20s 后重试"
            sleep 20
          done
          exit 1

      - name: Build HAP
        run: |
          set +e
          flutter build hap --release --target-platform ohos-arm64
          STATUS=$?
          set -e
          HAP="$(find ohos/entry/build -type f -name '*unsigned*.hap' 2>/dev/null | head -n 1)"
          [ -z "$HAP" ] && { echo "::error::未产出 HAP"; find ohos -name '*.hap'; exit 1; }
          [ "$STATUS" -ne 0 ] && echo "::notice::flutter 退出码 $STATUS（缺签名配置），已回收未签名 HAP"
          mkdir -p build/ohos && cp "$HAP" build/ohos/compass_unsigned.hap
        timeout-minutes: 40

# 在 build-hap.yml 的「Build HAP」之后追加：可选签名步骤。
# 有 HAP_SIGN_P12_B64 等 Secret → 产出签名包；没有 → 维持未签名产物，CI 不失败。

      - name: Sign HAP (optional)
        env:
          HAP_SIGN_P12_B64: ${{ secrets.HAP_SIGN_P12_B64 }}
          HAP_SIGN_CER_B64: ${{ secrets.HAP_SIGN_CER_B64 }}
          HAP_SIGN_P7B_B64: ${{ secrets.HAP_SIGN_P7B_B64 }}
          HAP_STORE_PASSWORD: ${{ secrets.HAP_STORE_PASSWORD }}
          HAP_KEY_ALIAS: ${{ secrets.HAP_KEY_ALIAS }}
          HAP_SIGN_TOOL_URL: ${{ secrets.HAP_SIGN_TOOL_URL }}
        run: |
          set +e
          if [ -z "$HAP_SIGN_P12_B64" ] || [ -z "$HAP_STORE_PASSWORD" ] || [ -z "$HAP_KEY_ALIAS" ] || [ -z "$HAP_SIGN_TOOL_URL" ]; then
            echo "::notice::签名材料不全（.p12 / 口令 / 别名 / 签名工具地址 任一缺失），跳过签名，产物仍为未签名包"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/hapsign"
          cd "$RUNNER_TEMP/hapsign"
          echo "$HAP_SIGN_P12_B64" | base64 -d > key.p12
          [ -n "$HAP_SIGN_CER_B64" ] && echo "$HAP_SIGN_CER_B64" | base64 -d > cert.cer
          [ -n "$HAP_SIGN_P7B_B64" ] && echo "$HAP_SIGN_P7B_B64" | base64 -d > profile.p7b
          chmod 600 key.p12
          if [ -z "$HAP_SIGN_TOOL_URL" ]; then
            echo "::error::已配置 .p12 但缺少 HAP_SIGN_TOOL_URL（hap-sign-tool.jar 下载地址）"
            exit 1
          fi
          curl -fsSL "$HAP_SIGN_TOOL_URL" -o hap-sign-tool.jar
          HAP_IN="$GITHUB_WORKSPACE/compass_app/build/ohos/compass_unsigned.hap"
          [ -z "$HAP_IN" ] && { echo "::error::找不到待签名 HAP"; exit 1; }
          ARGS=(sign-app -keyAlias "$HAP_KEY_ALIAS" -signAlg SHA256withECDSA -mode localSign -appCertFile cert.cer -profileFile profile.p7b -inFile "$HAP_IN" -keystoreFile key.p12 -keystorePwd "$HAP_STORE_PASSWORD" -outFile signed.hap)
          [ -f profile.p7b ] || ARGS=(sign-app -keyAlias "$HAP_KEY_ALIAS" -signAlg SHA256withECDSA -mode localSign -appCertFile cert.cer -inFile "$HAP_IN" -keystoreFile key.p12 -keystorePwd "$HAP_STORE_PASSWORD" -outFile signed.hap)
          java -jar hap-sign-tool.jar "${ARGS[@]}"
          if [ -f signed.hap ]; then
            mkdir -p "$GITHUB_WORKSPACE/compass_app/build/ohos"
            cp signed.hap "$GITHUB_WORKSPACE/compass_app/build/ohos/compass_signed.hap"
            echo "::notice::签名完成：compass_signed.hap"
          else
            echo "::warning::签名未产出 signed.hap，保留未签名包"
          fi
        timeout-minutes: 15

      - uses: actions/upload-artifact@v7
        with:
          name: compass-hap-unsigned
          archive: false
          # 未签名包必在；签名 Secret 齐备时同 artifact 内附带 compass_signed.hap
          path: |
            compass_app/build/ohos/compass_unsigned.hap
            compass_app/build/ohos/compass_signed.hap
          if-no-files-found: error
