# macOS 构建（单一平台文件，供 buildAll.yml 分发器按需调用）：
#   arm64 —— macos-14（M 系 runner）flutter build macos 直出
#   x64   —— 同一 runner 上 xcodebuild -arch x86_64 交叉编译（Flutter 不产 x64 桌面档）
# 两个架构各出独立 dmg（hdiutil 拖拽安装镜像，含 /Applications 软链），避免互相覆盖；
# 打包前用 lipo 校验实际架构，防止错包。产物为未签名 dmg（本机 Gatekeeper 需右键打开）。
name: Build macOS

on:
  workflow_call:
    inputs:
      arm64: {type: boolean, default: true}
      x64: {type: boolean, default: false}
  workflow_dispatch:
    inputs:
      arm64: {description: 'macOS arm64', type: boolean, default: true}
      x64: {description: 'macOS x64', type: boolean, default: false}

jobs:
  macos-arm64:
    name: macOS arm64
    if: ${{ inputs.arm64 }}
    runs-on: macos-14
    defaults: {run: {working-directory: compass_app}}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable, flutter-version: 3.47.7}
      - run: flutter build macos --release
      - name: 校验架构
        run: |
          APP=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          BIN="$APP/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")"
          echo "checking $BIN"; lipo -archs "$BIN"
      # .app 是目录——打成拖拽安装 dmg（含 /Applications 软链，未签名）后上传单文件
      - name: 打包 .app 为 dmg
        run: |
          set -euo pipefail
          APP=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          OUT="build/macos/Build/Products/KeZhou-macos-arm64.dmg"
          STAGE=$(mktemp -d)
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname KeZhou -srcfolder "$STAGE" -ov -format UDZO "$OUT"
          rm -rf "$STAGE"
          ls -lh "$OUT"
      - uses: actions/upload-artifact@v7
        with:
          name: kezhou-macos-arm64
          archive: false
          if-no-files-found: error
          path: compass_app/build/macos/Build/Products/KeZhou-macos-arm64.dmg

  macos-x64:
    name: macOS x64
    if: ${{ inputs.x64 }}
    runs-on: macos-14
    defaults: {run: {working-directory: compass_app}}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable, flutter-version: 3.47.7}
      - name: 仅生成工程配置（不构建）
        run: flutter build macos --release --config-only
      - name: xcodebuild 交叉编译 x86_64
        run: |
          cd macos
          # -derivedDataPath 钉到 flutter build macos 的同一布局（<root>/Build/Products/Release），
          # 否则产物落进 macos/build 旁路目录，后续校验/打包步骤找不到 .app（v0.12.1 实测）。
          xcodebuild -workspace Runner.xcworkspace -scheme Runner \
            -configuration Release -arch x86_64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO -derivedDataPath ../build/macos build
      - name: 校验架构（必须是 x86_64，失败即中止避免错包）
        run: |
          APP=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          BIN="$APP/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")"
          echo "checking $BIN"; lipo -archs "$BIN" | tee /dev/stderr | grep -q x86_64
      # .app 是目录——打成拖拽安装 dmg（含 /Applications 软链，未签名）后上传单文件
      - name: 打包 .app 为 dmg
        run: |
          set -euo pipefail
          APP=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          OUT="build/macos/Build/Products/KeZhou-macos-x64.dmg"
          STAGE=$(mktemp -d)
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname KeZhou -srcfolder "$STAGE" -ov -format UDZO "$OUT"
          rm -rf "$STAGE"
          ls -lh "$OUT"
      - uses: actions/upload-artifact@v7
        with:
          name: kezhou-macos-x64
          archive: false
          if-no-files-found: error
          path: compass_app/build/macos/Build/Products/KeZhou-macos-x64.dmg
